    <div class="dashboard-shell pl-16">

        <div class="dashboard-header h-40 lg:h-20 w-full flex flex-wrap">
            <nav id="header" class="bg-gray-200 w-full lg:max-w-sm flex items-center border-b border-gray-300 order-2 lg:order-1">

                <div class="px-2 w-full">
                    <select name="" class="bg-gray-300 border-2 border-gray-200 rounded-full w-full py-3 px-4 text-gray-500 font-bold leading-tight focus:outline-none focus:bg-white focus:shadow-md" id="form-field2">
                        <option value="Default">default</option>
                        <option value="A">report a</option>
                        <option value="B">report b</option>
                        <option value="C">report c</option>
                    </select>
                </div>

            </nav>
            <nav id="header1" class="bg-gray-100 w-auto flex-1 border-b border-gray-300 order-1 lg:order-2">

                <div class="flex h-full justify-between items-center">

                    <!--Search-->
                    <div class="relative w-full max-w-3xl px-6">
                        <div class="absolute h-10 mt-1 left-0 top-0 flex items-center pl-10">
                            <svg class="h-4 w-4 fill-current text-gray-600" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
                                <path d="M12.9 14.32a8 8 0 1 1 1.41-1.41l5.35 5.33-1.42 1.42-5.33-5.34zM8 14A6 6 0 1 0 8 2a6 6 0 0 0 0 12z"></path>
                            </svg>
                        </div>

                        <input id="search-toggle" type="search" placeholder="search" class="block w-full bg-gray-200 focus:outline-none focus:bg-white focus:shadow-md text-gray-700 font-bold rounded-full pl-12 pr-4 py-3">

                    </div>
                    <!-- / Search-->

                    <!--Menu-->

                    <div class="relative flex pr-6">

                        <div class="relative text-sm">
                            <button id="userButton" class="flex items-center focus:outline-none mr-3">
                                <img class="w-8 h-8 rounded-full mr-4" src="http://i.pravatar.cc/300" alt="Avatar of User"> <span class="hidden md:inline-block">Hi, User </span>
                                <svg class="pl-2 h-2" version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 129 129" xmlns:xlink="http://www.w3.org/1999/xlink" enable-background="new 0 0 129 129">
                                    <g>
                                        <path d="m121.3,34.6c-1.6-1.6-4.2-1.6-5.8,0l-51,51.1-51.1-51.1c-1.6-1.6-4.2-1.6-5.8,0-1.6,1.6-1.6,4.2 0,5.8l53.9,53.9c0.8,0.8 1.8,1.2 2.9,1.2 1,0 2.1-0.4 2.9-1.2l53.9-53.9c1.7-1.6 1.7-4.2 0.1-5.8z"></path>
                                    </g>
                                </svg>
                            </button>
                            <div id="userMenu" class="bg-white nunito rounded shadow-md absolute mt-12 top-0 right-0 min-w-full overflow-auto z-30 invisible">
                                <ul class="list-reset">
                                    <li><a href="#" class="px-4 py-2 block text-gray-900 hover:bg-indigo-400 hover:text-white no-underline hover:no-underline">My account</a></li>
                                    <li><a href="#" class="px-4 py-2 block text-gray-900 hover:bg-indigo-400 hover:text-white no-underline hover:no-underline">Notifications</a></li>
                                    <li>
                                        <hr class="border-t mx-2 border-gray-400">
                                    </li>
                                    <li><a href="#" class="px-4 py-2 block text-gray-900 hover:bg-indigo-400 hover:text-white no-underline hover:no-underline">Logout</a></li>
                                </ul>
                            </div>
                        </div>

                    </div>

                    <!-- / Menu -->

                </div>

            </nav>
        </div>

        <!--Dash Content -- LISTA DE LAS UNIDADES DISPONIBLES-->
        <div id="dash-content" class="units-panel bg-gray-200 py-6 lg:py-0 w-full lg:max-w-sm flex flex-wrap content-start">

            @for (unidad of unidades(); track unidad.UIDunidad) {
                <div class="w-1/2 lg:w-full">
                    <div class="m-2 rounded border-2 border-dashed border-gray-400 p-6 hover:border-transparent hover:bg-white hover:shadow-xl md:mx-10 md:my-6">
                        <div class="flex items-center">
                            <!-- 33% (w-1/3): Ícono centrado -->
                            <div class="w-1/3 flex justify-center">
                                <div class="rounded-full bg-gray-300 p-3">
                                    <svg class="h-5 w-5 text-gray-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 7h11v10H3zM14 10h4l3 3v4h-7z" /><path d="M6 17a2 2 0 1 0 4 0M16 17a2 2 0 1 0 4 0" /></svg>
                                </div>
                            </div>
                            
                            <!-- 66% (w-2/3): Texto alineado exactamente como el original -->
                            <div class="w-2/3 flex-1">
                                <h3 class="font-bold text-3xl text-gray-900">A-8565</h3>
                                <h5 class="font-bold text-gray-500">Operativa / En base</h5>
                            </div>
                        </div>
                    </div>
                </div>
            } @empty {
                <div class="col-span-full flex flex-col items-center justify-center py-12">
                    <p class="text-slate-500 text-center font-medium">No hay unidades disponibles.</p>
                </div>
            }

            

            <!-- BOTON PARA AÑADIR NUEVAS UNIDADES -->
            <div class="units-panel-action w-full px-4 py-3">
                <button
                    (click)="crearUnidad()"
                    type="button"
                    class="flex w-full items-center justify-center gap-2 rounded bg-blue-600 px-4 py-3 font-bold text-white shadow transition hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:ring-offset-2"
                    aria-label="Añadir nueva unidad"
                    title="Añadir nueva unidad">
                    <span class="text-2xl leading-none" aria-hidden="true">+</span>
                    <span>Añadir unidad</span>
                </button>
            </div>


        </div>

        <!-- Seccion reservada para el mapa de unidades. -->
        <section id="map-section" class="map-section w-full flex-1 p-6" aria-labelledby="map-title">
            <h2 id="map-title" class="mb-4 text-xl font-bold text-gray-900">Mapa de unidades</h2>
            <div id="map" class="flex min-h-96 w-full h-full rounded border border-gray-300 bg-white" aria-label="Mapa de unidades">
                <!-- <div class="flex h-full w-full flex-col items-center justify-center text-center">
                    <img src="/miscelanea/obra" alt="ícono de obras">
                    <h1 class="w-full">SECCIÓN EN DESARROLLO</h1>
                </div> -->

                <google-map 
                    height="100%" 
                    width="100%" 
                    [center]="center" 
                    [zoom]="zoom"
                    [options]="options">
                    
                    <!-- Iterar sobre las unidades e imprimir sus ubicaciones -->
                    @for (unidad of unidades(); track unidad.UIDunidad) {
                        <map-marker 
                        [position]="{ lat: unidad.latitud, lng: unidad.longitud }"
                        [title]="unidad.tipo + ' (' + unidad.estado + ')'"
                        [options]="getIconosPersonalizados(unidad.tipo)">
                        </map-marker>
                    }
                </google-map>
            </div>
        </section>

    </div>
